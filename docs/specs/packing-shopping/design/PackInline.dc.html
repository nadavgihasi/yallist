<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Yallist — פריט פרטי ברשימה</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3D53E8}a:hover{color:#101725}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 24px 16px 0; background: #F4F5F8; font-family: Rubik, system-ui, -apple-system, sans-serif; color: #101725; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Trip.dc.html" aria-label="חזרה לטיול" style="display: flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="#101725" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 800; letter-spacing: -0.01em">קמפינג בכנרת</h1>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #FFFFFF">
<button type="button" aria-pressed="true" style="height: 44px; border: 0; border-radius: 999px; background: #425AF4; color: #FFFFFF; font-family: Rubik, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700">מביאים · 20</button>
<button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 999px; background: #FFFFFF; color: #4D5564; font-family: Rubik, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700">קונים · 7</button>
</div>
<div style="display: flex; gap: 8px">
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #FFFFFF; color: #4D5564; font-family: Rubik, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700">הכול</button>
<button type="button" aria-pressed="true" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #101725; color: #FFFFFF; font-family: Rubik, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700">עליי · 5</button>
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #FFFFFF; color: #4D5564; font-family: Rubik, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700">חסר · 6</button>
</div>
<section style="display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; border-radius: 24px; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<span aria-hidden="true" style="flex: none; box-sizing: border-box; width: 28px; height: 28px; border-radius: 999px; border: 2px solid #4D5564"></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">כיסאות מתקפלים ×4</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">לקבוצה</p>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<span style="display: flex; align-items: center; justify-content: center; flex: none; width: 28px; height: 28px; border-radius: 999px; background: #FF5A1F">
<svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="ארוז"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">מצננת</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">לקבוצה · ארוז</p>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<span style="display: flex; align-items: center; justify-content: center; flex: none; width: 28px; height: 28px; border-radius: 999px; background: #FF5A1F">
<svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="ארוז"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<p style="display: flex; align-items: center; gap: 6px; margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">
<svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="פרטי"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="#4D5564" stroke-width="2.2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#4D5564" stroke-width="2.2" stroke-linecap="round"></path></svg>
מטען נייד
</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">רק שלי · ארוז</p>
</div>
</div>
</section>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(16, 23, 37, 0.45)"></div>
<section aria-label="פריט חדש" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 24px; border-radius: 28px 28px 0 0; background: #FFFFFF">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 999px; background: #D5D9E0"></span>
<h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 800">פריט חדש</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pi-name" style="font-size: 14px; line-height: 20px; font-weight: 700; color: #4D5564">מה מביאים?</label>
<input id="pi-name" type="text" value="בגד ים" style="box-sizing: border-box; height: 52px; padding: 0 16px; border: 0; border-radius: 16px; background: #F4F5F8; color: #101725; font-family: Rubik, system-ui, sans-serif; font-size: 17px; line-height: 24px">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 700; color: #4D5564">למי זה?</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #F4F5F8">
<button type="button" onClick="{{pickGroup}}" aria-pressed="{{groupPressed}}" style="height: 44px; border: 0; border-radius: 999px; background: {{groupBg}}; color: {{groupFg}}; font-family: Rubik, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700; cursor: pointer">לכל הקבוצה</button>
<button type="button" onClick="{{pickPrivate}}" aria-pressed="{{privatePressed}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border: 0; border-radius: 999px; background: {{privateBg}}; color: {{privateFg}}; font-family: Rubik, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg>
רק לי
</button>
</div>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">{{visibilityCaption}}</p>
</div>
<sc-if value="{{isPrivate}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px">
<div style="display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">להוסיף לקבועים שלי</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">ייכנס לבד לכל טיול הבא</p>
</div>
<button type="button" onClick="{{toggleKeep}}" aria-pressed="{{keepPressed}}" aria-label="להוסיף לקבועים שלי" style="position: relative; flex: none; width: 52px; height: 32px; padding: 0; border: 0; border-radius: 999px; background: {{keepTrack}}; cursor: pointer">
<span style="position: absolute; top: 3px; {{keepKnobSide}}: 3px; width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF"></span>
</button>
</div>
</sc-if>
<button type="button" style="height: 56px; border: 0; border-radius: 999px; background: #425AF4; color: #FFFFFF; font-family: Rubik, system-ui, sans-serif; font-size: 18px; line-height: 24px; font-weight: 800; cursor: pointer">הוספה</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const isPrivate = s.isPrivate !== false;
const keep = s.keep !== false;
return {
isPrivate: isPrivate,
pickGroup: () => this.setState({ isPrivate: false, keep: keep }),
pickPrivate: () => this.setState({ isPrivate: true, keep: keep }),
toggleKeep: () => this.setState({ isPrivate: isPrivate, keep: !keep }),
groupPressed: isPrivate ? 'false' : 'true',
privatePressed: isPrivate ? 'true' : 'false',
groupBg: isPrivate ? 'transparent' : '#425AF4',
groupFg: isPrivate ? '#4D5564' : '#FFFFFF',
privateBg: isPrivate ? '#425AF4' : 'transparent',
privateFg: isPrivate ? '#FFFFFF' : '#4D5564',
visibilityCaption: isPrivate ? 'הפריט גלוי רק לך ולא נספר בהתקדמות של הקבוצה.' : 'כולם יראו את הפריט ויוכלו לקחת אותו.',
keepPressed: keep ? 'true' : 'false',
keepTrack: keep ? '#425AF4' : '#B8BEC9',
keepKnobSide: keep ? 'left' : 'right'
};
}
}
</script>
</body>
</html>
