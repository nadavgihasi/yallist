<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Yallist — סיום קניות</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3D53E8}a:hover{color:#101725}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 24px 16px 0; background: #F4F5F8; font-family: Rubik, system-ui, -apple-system, sans-serif; color: #101725; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 800">בסופר</p>
<p style="margin: 0; font-size: 15px; line-height: 20px; color: #4D5564">קניות לקמפינג בכנרת</p>
</div>
<div style="height: 220px; border-radius: 24px; background: #FFFFFF"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(16, 23, 37, 0.45)"></div>
<section aria-label="סיום קניות" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 24px; border-radius: 28px 28px 0 0; background: #FFFFFF">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 999px; background: #D5D9E0"></span>
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800">כמה יצא בקופה?</h1>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="run-total" style="font-size: 14px; line-height: 20px; font-weight: 700; color: #4D5564">סכום אחד לכל הקנייה</label>
<div dir="ltr" style="display: flex; align-items: center; gap: 8px; height: 76px; padding: 0 20px; border-radius: 20px; background: #F4F5F8">
<span aria-hidden="true" style="font-size: 30px; line-height: 36px; font-weight: 800; color: #4D5564">₪</span>
<input id="run-total" type="text" inputmode="decimal" value="{{amount}}" onInput="{{onAmount}}" style="flex-grow: 1; min-width: 0; height: 56px; padding: 0; border: 0; background: transparent; color: #101725; font-family: Rubik, system-ui, sans-serif; font-size: 40px; line-height: 48px; font-weight: 800">
</div>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border: 0; border-radius: 999px; background: #E8EBFE; color: #3D53E8; font-family: Rubik, system-ui, sans-serif; font-size: 16px; line-height: 22px; font-weight: 700; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="#3D53E8" stroke-width="2.2" stroke-linejoin="round"></path><circle cx="12" cy="13" r="3.5" fill="none" stroke="#3D53E8" stroke-width="2.2"></circle></svg>
צילום קבלה · לא חובה
</button>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="display: flex; align-items: center; justify-content: center; flex: none; width: 32px; height: 32px; border-radius: 999px; background: #FF5A1F">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">4 פריטים יסומנו כנקנו</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">נקניקיות, מים, ביצים, פחמים</p>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; box-sizing: border-box; width: 32px; height: 32px; border-radius: 999px; border: 2px dashed #4D5564"></span>
<div style="display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">קפה וחלב חוזר לרשימה</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">מישהו אחר יכול לקחת</p>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span style="display: flex; align-items: center; justify-content: center; flex: none; width: 32px; height: 32px; border-radius: 999px; background: #F4F5F8">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 19v-1a4 4 0 0 0-3-3.9M15 4.1a3.5 3.5 0 0 1 0 6.8" fill="none" stroke="#101725" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">{{perPerson}}</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">מתחלק שווה בין 8 בטיול</p>
</div>
<button type="button" style="flex: none; height: 44px; padding: 0 4px; border: 0; background: transparent; color: #3D53E8; font-family: Rubik, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700; cursor: pointer">שינוי</button>
</div>
</div>
<button type="button" style="height: 56px; border: 0; border-radius: 999px; background: #425AF4; color: #FFFFFF; font-family: Rubik, system-ui, sans-serif; font-size: 18px; line-height: 24px; font-weight: 800; cursor: pointer">שמירה</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const amount = s.amount === undefined ? '486.90' : s.amount;
const value = parseFloat(String(amount).replace(',', '.'));
const per = isFinite(value) && value > 0 ? (value / 8).toFixed(2) : null;
return {
amount: amount,
onAmount: (e) => this.setState({ amount: e.target.value }),
perPerson: per ? '₪' + per + ' לכל אחד' : 'מזינים סכום'
};
}
}
</script>
</body>
</html>
