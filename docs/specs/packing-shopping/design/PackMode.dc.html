<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Yallist — אורזים</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3D53E8}a:hover{color:#101725}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 24px 16px 0; background: #F4F5F8; font-family: Rubik, system-ui, -apple-system, sans-serif; color: #101725; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: -0.01em">אורזים לכנרת</h1>
<p style="margin: 0; font-size: 15px; line-height: 20px; color: #4D5564">יוצאים מחר ב־8:00</p>
</div>
<a href="Trip.dc.html" aria-label="סגירה" style="display: flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#101725" stroke-width="2.5" stroke-linecap="round"></path></svg>
</a>
</div>
<section style="display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; border-radius: 24px; background: #FFFFFF">
<p style="display: flex; align-items: baseline; gap: 8px; margin: 0">
<span style="font-size: 40px; line-height: 48px; font-weight: 800">{{done}}</span>
<span style="font-size: 16px; line-height: 22px; color: #4D5564">{{ofLabel}}</span>
</p>
<div style="height: 8px; border-radius: 999px; background: #F4F5F8; overflow: hidden">
<div style="width: {{pct}}; height: 8px; border-radius: 999px; background: #FF5A1F"></div>
</div>
</section>
<sc-if value="{{hasLeft}}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; border-radius: 24px; background: #FFFFFF">
<p style="margin: 0 0 4px; font-size: 14px; line-height: 20px; font-weight: 700; color: #4D5564">{{leftLabel}}</p>
<sc-for list="{{toPack}}" as="item" hint-placeholder-count="5">
<button type="button" onClick="{{item.pack}}" aria-label="{{item.ariaLabel}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0; border: 0; background: transparent; color: #101725; font-family: Rubik, system-ui, sans-serif; text-align: start; cursor: pointer">
<span aria-hidden="true" style="flex: none; box-sizing: border-box; width: 32px; height: 32px; border-radius: 999px; border: 2px solid #4D5564"></span>
<span style="flex-grow: 1; font-size: 17px; line-height: 24px; font-weight: 700">{{item.name}}</span>
<span style="flex: none; padding: 4px 10px; border-radius: 999px; background: #F4F5F8; color: #4D5564; font-size: 13px; line-height: 18px; font-weight: 700">{{item.tag}}</span>
</button>
</sc-for>
</section>
</sc-if>
<sc-if value="{{allDone}}" hint-placeholder-val="{{ false }}">
<section style="display: flex; align-items: center; gap: 16px; padding: 20px; border-radius: 24px; background: #FFFFFF">
<span style="display: flex; align-items: center; justify-content: center; flex: none; width: 48px; height: 48px; border-radius: 999px; background: #FF5A1F">
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 800">הכול ארוז</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">הקבוצה רואה שהתיק מוכן. נסיעה טובה!</p>
</div>
</section>
</sc-if>
<section style="display: flex; flex-direction: column; gap: 6px; padding: 16px 20px; border-radius: 24px; background: #FFFFFF">
<p style="display: flex; align-items: center; gap: 8px; margin: 0; font-size: 14px; line-height: 20px; font-weight: 700; color: #C93F0E">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#C93F0E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
{{packedHeader}}
</p>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #4D5564">{{packedNames}}</p>
</section>
<section style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-radius: 24px; background: #FFFFFF">
<span style="display: flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; border-radius: 999px; background: #F4F5F8">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l2.5 5 5.5.8-4 3.9.9 5.5L12 16.6l-4.9 2.6.9-5.5-4-3.9 5.5-.8z" fill="none" stroke="#101725" stroke-width="2" stroke-linejoin="round"></path></svg>
</span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">הקבועים שלי</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">14 דברים שנכנסים לבד לכל טיול</p>
</div>
<button type="button" style="flex: none; height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #E8EBFE; color: #3D53E8; font-family: Rubik, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700; cursor: pointer">עריכה</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const items = [
{ id: 'chairs', name: 'כיסאות מתקפלים ×4', tag: 'לקבוצה' },
{ id: 'cooler', name: 'מצננת', tag: 'לקבוצה' },
{ id: 'sleeping', name: 'שק שינה', tag: 'אחד לכל אחד' },
{ id: 'powerbank', name: 'מטען נייד', tag: 'קבוע' },
{ id: 'sunglasses', name: 'משקפי שמש', tag: 'קבוע' },
{ id: 'lamp', name: 'פנס ראש', tag: 'אחד לכל אחד' },
{ id: 'swim', name: 'בגד ים', tag: 'קבוע' },
{ id: 'sunscreen', name: 'קרם הגנה', tag: 'קבוע' },
{ id: 'towel', name: 'מגבת', tag: 'קבוע' },
{ id: 'hat', name: 'כובע', tag: 'קבוע' },
{ id: 'flipflops', name: 'כפכפים', tag: 'קבוע' }
];
const packed = s.packed || { lamp: true, swim: true, sunscreen: true, towel: true, hat: true, flipflops: true };
const left = items.filter((x) => !packed[x.id]);
const done = items.filter((x) => packed[x.id]);
return {
toPack: left.map((x) => ({
name: x.name,
tag: x.tag,
ariaLabel: 'סימון ' + x.name + ' כארוז',
pack: () => {
const next = Object.assign({}, packed);
next[x.id] = true;
this.setState({ packed: next });
}
})),
hasLeft: left.length > 0,
allDone: left.length === 0,
leftLabel: 'עוד לארוז · ' + left.length,
done: done.length,
ofLabel: 'מתוך ' + items.length + ' ארוזים',
pct: Math.round(done.length / items.length * 100) + '%',
packedHeader: 'ארוז · ' + done.length,
packedNames: done.map((x) => x.name).join(' · ')
};
}
}
</script>
</body>
</html>
