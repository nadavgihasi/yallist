<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Yallist — סלים</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3D53E8}a:hover{color:#101725}
</style>
</helmet>
<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 24px 16px 0; background: #F4F5F8; font-family: Rubik, system-ui, -apple-system, sans-serif; color: #101725; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Trip.dc.html" aria-label="חזרה לטיול" style="display: flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="#101725" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 800; letter-spacing: -0.01em">קמפינג בכנרת</h1>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #FFFFFF">
<button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 999px; background: #FFFFFF; color: #4D5564; font-family: Rubik, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700">מביאים · 20</button>
<button type="button" aria-pressed="true" style="height: 44px; border: 0; border-radius: 999px; background: #425AF4; color: #FFFFFF; font-family: Rubik, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700">קונים · 13</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">פריטים חדשים נכנסים לסל לפי הסוג</p>
<button type="button" style="display: flex; align-items: center; gap: 6px; flex: none; height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #E8EBFE; color: #3D53E8; font-family: Rubik, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="#3D53E8" stroke-width="2.5" stroke-linecap="round"></path></svg>
סל חדש
</button>
</div>
<section style="display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; border-radius: 24px; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 12px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 800">סופר</h2>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">8 פריטים · נועה</p>
</div>
<span style="display: flex; align-items: center; justify-content: center; flex: none; width: 32px; height: 32px; border-radius: 999px; background: #425AF4; color: #FFFFFF; font-size: 14px; font-weight: 800">נ</span>
</div>
<p style="display: flex; align-items: center; gap: 6px; margin: 0; font-size: 14px; line-height: 20px; font-weight: 700; color: #C93F0E">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#C93F0E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
נקנה הכול · ₪480
</p>
</section>
<section style="display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; border-radius: 24px; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 12px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 800">קצביה</h2>
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">3 פריטים · עוד אין מי שקונה</p>
</sc-if>
<sc-if value="{{mine}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 700; color: #C93F0E">3 פריטים · עליך</p>
</sc-if>
</div>
</div>
<sc-for list="{{meat}}" as="item" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<span aria-hidden="true" style="flex: none; width: 6px; height: 6px; border-radius: 999px; background: #4D5564"></span>
<span style="flex-grow: 1; font-size: 16px; line-height: 22px">{{item.name}}</span>
<span style="flex: none; font-size: 14px; line-height: 20px; color: #4D5564">{{item.qty}}</span>
<button type="button" aria-label="{{item.moveLabel}}" style="display: flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; margin: -6px; padding: 0; border: 0; background: transparent; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3" fill="none" stroke="#4D5564" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
</sc-for>
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{claim}}" style="height: 48px; margin-top: 4px; border: 0; border-radius: 999px; background: #E8EBFE; color: #3D53E8; font-family: Rubik, system-ui, sans-serif; font-size: 16px; line-height: 22px; font-weight: 700; cursor: pointer">כל הסל עליי</button>
</sc-if>
<sc-if value="{{mine}}" hint-placeholder-val="{{ false }}">
<a href="ShopRunDone.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; margin-top: 4px; border-radius: 999px; background: #425AF4; color: #FFFFFF; font-size: 16px; line-height: 22px; font-weight: 700; text-decoration: none">קניתי · סכום אחד לסל</a>
</sc-if>
</section>
<section style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-radius: 24px; background: #FFFFFF">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 800">בדרך לכנרת</h2>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">קרח, פחמים · רון</p>
</div>
<span style="display: flex; align-items: center; justify-content: center; flex: none; width: 32px; height: 32px; border-radius: 999px; background: #425AF4; color: #FFFFFF; font-size: 14px; font-weight: 800">ר</span>
</section>
<button type="button" style="position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; height: 60px; padding: 0 28px; border: 0; border-radius: 999px; background: #425AF4; color: #FFFFFF; font-family: Rubik, system-ui, sans-serif; font-size: 18px; line-height: 24px; font-weight: 800; white-space: nowrap; box-shadow: 0 10px 24px rgba(16, 23, 37, 0.18)">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"></path></svg>
פריט חדש
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const mine = !!s.mine;
const meat = [
{ name: 'בשר לעל האש', qty: '4 ק״ג' },
{ name: 'נקניקיות', qty: '2 חבילות' },
{ name: 'כבד עוף', qty: '1 ק״ג' }
];
return {
mine: mine,
open: !mine,
claim: () => this.setState({ mine: true }),
release: () => this.setState({ mine: false }),
meat: meat.map((x) => ({ name: x.name, qty: x.qty, moveLabel: 'העברת ' + x.name + ' לסל אחר' }))
};
}
}
</script>
</body>
</html>
