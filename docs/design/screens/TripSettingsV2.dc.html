<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הגדרות הטיול</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Rubik:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
a{color:#3B5BFD}a:hover{color:#2A44D1}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; direction: rtl; background: #F4F5F8; color: #0E1726; font-family: 'Rubik', system-ui, sans-serif">
<div style="position: absolute; inset: 0; overflow-y: auto; padding: 0 16px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<div style="padding-top: 12px; display: flex; align-items: center; gap: 12px">
<a href="TripV2.dc.html" aria-label="חזרה לטיול" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; color: #0E1726; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; flex: 0 0 auto">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Fredoka', 'Rubik', system-ui, sans-serif; font-size: 28px; font-weight: 700">הגדרות הטיול</h1>
</div>

<section style="padding: 12px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; gap: 14px">
<div style="width: 72px; height: 72px; border-radius: 18px; overflow: hidden; flex: 0 0 auto">
<svg viewBox="40 90 300 210" preserveAspectRatio="xMidYMid slice" width="72" height="72" aria-hidden="true" style="display: block"><rect width="390" height="300" fill="#FFB774"></rect><circle cx="268" cy="118" r="48" fill="#FFE39B"></circle><path d="M0 168 C70 138 128 152 190 136 C250 121 310 146 390 128 L390 300 L0 300 Z" fill="#B07CC6"></path><path d="M0 196 C80 170 150 188 220 172 C290 157 340 182 390 170 L390 300 L0 300 Z" fill="#7A55B5"></path><rect y="206" width="390" height="94" fill="#2F4FD8"></rect><path d="M0 262 C90 248 170 272 260 256 C320 246 360 258 390 252 L390 300 L0 300 Z" fill="#1F1752"></path><path d="M44 264 L84 214 L124 264 Z" fill="#FFCF3F"></path></svg>
</div>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Fredoka', 'Rubik', system-ui, sans-serif; font-size: 20px; font-weight: 600">קמפינג בכנרת</span>
<span style="font-size: 14px; color: #4B5565">8 משתתפים, 20 פריטים</span>
</div>
<button style="{{softPill}}">החלפת תמונה</button>
</section>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; padding: 4px 4px 0; font-family: 'Fredoka', 'Rubik', system-ui, sans-serif; font-size: 20px; font-weight: 600">{{g.title}}</h2>
<div style="border-radius: 24px; background: #FFFFFF; overflow: hidden">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<sc-if value="{{r.notFirst}}" hint-placeholder-val="{{true}}"><div style="height: 1px; background: #EEF0F4; margin-inline-start: 18px"></div></sc-if>
<button style="width: 100%; min-height: 60px; padding: 10px 18px; border: none; background: transparent; color: #0E1726; display: flex; align-items: center; gap: 12px; text-align: start; cursor: pointer">
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 500">{{r.label}}</span>
<sc-if value="{{r.hasHint}}" hint-placeholder-val="{{false}}"><span style="{{hintChip}}">{{r.hint}}</span></sc-if>
</div>
<span style="{{r.valueStyle}}">{{r.value}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</button>
</sc-for>
</div>
</section>
</sc-for>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; padding: 4px 4px 0; font-family: 'Fredoka', 'Rubik', system-ui, sans-serif; font-size: 20px; font-weight: 600">התראות לטיול הזה</h2>
<div style="border-radius: 24px; background: #FFFFFF; overflow: hidden">
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
<sc-if value="{{t.notFirst}}" hint-placeholder-val="{{true}}"><div style="height: 1px; background: #EEF0F4; margin-inline-start: 18px"></div></sc-if>
<div style="min-height: 60px; padding: 10px 18px; box-sizing: border-box; display: flex; align-items: center; gap: 12px">
<span id="{{t.labelId}}" style="flex: 1 1 auto; font-size: 16px; font-weight: 500">{{t.label}}</span>
<button role="switch" aria-checked="{{t.on}}" aria-labelledby="{{t.labelId}}" onClick="{{t.toggle}}" style="{{t.trackStyle}}"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(14,23,38,0.25)"></span></button>
</div>
</sc-for>
</div>
</section>

<a href="ParticipantsV2.dc.html" style="min-height: 64px; padding: 10px 18px; box-sizing: border-box; border-radius: 24px; background: #FFFFFF; color: #0E1726; display: flex; align-items: center; gap: 12px; text-decoration: none">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 500">משתתפים</span>
<span style="font-size: 13px; color: #4B5565">8 בטיול, 2 מחכים לאישור</span>
</div>
<span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #C2410C; color: #FFFFFF; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">2</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>

<a href="InviteV2.dc.html" style="min-height: 64px; padding: 10px 18px; box-sizing: border-box; border-radius: 24px; background: #FFFFFF; color: #0E1726; display: flex; align-items: center; gap: 12px; text-decoration: none">
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 500">קישור הזמנה</span>
<span style="font-size: 13px; color: #4B5565">מצטרפים חדשים מחכים לאישור</span>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>

<div style="border-radius: 24px; background: #FFFFFF; overflow: hidden">
<button style="width: 100%; min-height: 56px; padding: 0 18px; border: none; background: transparent; color: #0E1726; display: flex; align-items: center; text-align: start; font-size: 16px; font-weight: 500; cursor: pointer">יציאה מהטיול</button>
<div style="height: 1px; background: #EEF0F4; margin-inline-start: 18px"></div>
<button style="width: 100%; min-height: 64px; padding: 10px 18px; border: none; background: transparent; color: #C2410C; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: start; cursor: pointer">
<span style="font-size: 16px; font-weight: 500">מחיקת הטיול</span>
<span style="font-size: 13px; color: #4B5565">רק מארגנים יכולים, והטיול יימחק לכל המשתתפים</span>
</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3B5BFD","options":["#3B5BFD","#0E7C66","#7C3AED"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const s = this.state || {};
    const accent = this.props.accent ?? '#3B5BFD';
    const on = Object.assign({ claims: true, dayBefore: true, digest: false }, s.on || {});
    const value = 'font-size: 15px; color: #4B5565; flex: 0 0 auto';
    const GROUPS = [
      { title: 'פרטים', rows: [
        { label: 'שם הטיול', value: 'קמפינג בכנרת' },
        { label: 'תאריכים', value: '13–14 בנובמבר' },
        { label: 'מקום', value: 'עוד לא נבחר', hint: 'בקרוב: עזרה בבחירת מקום', muted: true }
      ] },
      { title: 'כסף', rows: [
        { label: 'חלוקת הוצאות', value: 'שווה בין כולם' },
        { label: 'מטבע', value: '₪ שקל' }
      ] },
      { title: 'הרשאות', rows: [
        { label: 'מי יכול למחוק פריטים', value: 'כולם' },
        { label: 'מי יכול להוסיף הוצאות', value: 'כולם' }
      ] }
    ];
    const TOGGLES = [
      { id: 'claims', label: 'כשמישהו לוקח פריט' },
      { id: 'dayBefore', label: 'תזכורת לכולם יום לפני' },
      { id: 'digest', label: 'סיכום יומי במקום כל עדכון' }
    ];
    return {
      softPill: 'min-height: 44px; padding: 0 14px; border-radius: 22px; border: none; flex: 0 0 auto; background: ' + accent + '1F; color: ' + accent + '; font-size: 14px; font-weight: 600; cursor: pointer',
      hintChip: 'align-self: flex-start; height: 24px; padding: 0 10px; border-radius: 12px; background: ' + accent + '1F; color: ' + accent + '; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center',
      groups: GROUPS.map(function (g) {
        return {
          title: g.title,
          rows: g.rows.map(function (r, i) {
            return { label: r.label, value: r.value, hint: r.hint || '', hasHint: !!r.hint, notFirst: i > 0, valueStyle: value + (r.muted ? '; font-style: normal; color: #9AA3B2' : '') };
          })
        };
      }),
      toggles: TOGGLES.map(function (t, i) {
        const isOn = !!on[t.id];
        return {
          label: t.label,
          labelId: 'trip-pref-' + t.id,
          on: isOn,
          notFirst: i > 0,
          toggle: function () {
            const next = Object.assign({}, on);
            next[t.id] = !isOn;
            self.setState({ on: next });
          },
          trackStyle: 'width: 52px; height: 32px; flex: 0 0 auto; box-sizing: border-box; padding: 3px; border: none; border-radius: 16px; display: flex; align-items: center; cursor: pointer; justify-content: ' + (isOn ? 'flex-end' : 'flex-start') + '; background: ' + (isOn ? accent : '#D9DDE6')
        };
      })
    };
  }
}
</script>
</body>
</html>
