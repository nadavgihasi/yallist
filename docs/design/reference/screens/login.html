<!doctype html>
<html lang="he" dir="rtl">
<head>

<title>Yallist — כניסה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;800&amp;display=swap">
<style>

a{color:#3D53E8}a:hover{color:#101725}
</style>
</head>
<body>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 88px 16px 32px; background: #F4F5F8; font-family: Rubik, system-ui, -apple-system, sans-serif; color: #101725; display: flex; flex-direction: column; gap: 32px; overflow: hidden">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">

<h1 style="margin: 16px 0 0; font-size: 24px; line-height: 30px; font-weight: 800">מי מביא מה?</h1>
<p style="margin: 0; max-width: 300px; font-size: 16px; line-height: 24px; color: #4D5564">רשימה אחת לכל הטיול. פותחים, שולחים בוואטסאפ, וכולם רואים מה עוד חסר.</p>
</div>
<section aria-label="דוגמה לרשימת ציוד" style="background: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">קמפינג בכנרת</p>

<div style="display: flex; align-items: center">
<span style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; background: #425AF4; color: #FFFFFF; font-size: 12px; font-weight: 800; box-shadow: 0 0 0 2px #FFFFFF">א</span>
<span style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-inline-start: -8px; border-radius: 999px; background: #425AF4; color: #FFFFFF; font-size: 12px; font-weight: 800; box-shadow: 0 0 0 2px #FFFFFF">נ</span>
<span style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-inline-start: -8px; border-radius: 999px; background: #E8EBFE; color: #3D53E8; font-size: 12px; font-weight: 800; box-shadow: 0 0 0 2px #FFFFFF">+6</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<span style="display: flex; align-items: center; justify-content: center; flex: none; width: 28px; height: 28px; border-radius: 999px; background: #FF5A1F">
<svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="ארוז"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">אוהל ל־4</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">איתי מביא · ארוז</p>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<span style="display: flex; align-items: center; justify-content: center; flex: none; width: 28px; height: 28px; border-radius: 999px; background: #FF5A1F">
<svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="ארוז"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">חומוס ×3</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">נועה מביאה · ארוז</p>

</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<span aria-hidden="true" style="flex: none; box-sizing: border-box; width: 28px; height: 28px; border-radius: 999px; border: 2px dashed #4D5564"></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">מצננת</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">עוד אין מי שמביא</p>

<button type="button" style="flex: none; height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #E8EBFE; color: #3D53E8; font-family: Rubik, system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700">עליי</button>

</section>
<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px">

<p style="margin: 0; font-size: 14px; line-height: 20px; color: #4D5564">בהמשך אתם מסכימים ל<a href="#terms">תנאי השימוש</a></p>
</div>
</div>
