<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/tokens.css"><title>Header — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;800&amp;display=swap">
<style>
html,body{margin:0}
body{background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);max-width:var(--content-max);margin:0 auto;padding:var(--space-4) var(--space-5)}
.hdr h1{margin:0;color:var(--ink)}
.avatar{width:var(--size-avatar);height:var(--size-avatar);flex:none;border:0;border-radius:var(--radius-pill);background:var(--primary);color:var(--on-primary);font-family:var(--font-sans);font-size:18px;font-weight:800;line-height:1;cursor:pointer}
</style></head>
<body>
<header class="hdr">
<h1 class="page-title">הטיולים שלי</h1>
<button class="avatar" type="button" aria-label="החשבון שלי">a</button>
</header>
</body>
</html>
