<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/tokens.css"><title>Avatar — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;800&amp;display=swap">
<style>
html,body{margin:0}
body{background:var(--surface);font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-5) var(--space-6)}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:var(--size-avatar);height:var(--size-avatar);border:0;border-radius:var(--radius-pill);background:var(--primary);color:var(--on-primary);font-family:var(--font-sans);font-size:18px;font-weight:800;line-height:1;cursor:pointer}
</style></head>
<body>
<div class="row">
<button class="avatar" type="button" aria-label="החשבון של Avi">a</button>
<button class="avatar" type="button" aria-label="החשבון של נדב">נ</button>
</div>
</body>
</html>
