<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/tokens.css"><title>Steps — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;800&amp;display=swap">
<style>
html,body{margin:0}
body{background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.wrap{max-width:var(--content-max);margin:0 auto;padding:var(--space-5)}
.card{background:var(--card);border-radius:var(--radius-card);padding:var(--space-5)}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-6)}
li{display:flex;align-items:center;gap:var(--space-4)}
.num{display:flex;align-items:center;justify-content:center;flex:none;width:var(--size-step);height:var(--size-step);border-radius:var(--radius-pill);background:var(--primary-tint);color:var(--primary)}
.copy{display:flex;flex-direction:column;gap:var(--space-1)}
.copy p{margin:0}
.muted{color:var(--ink-muted)}
</style></head>
<body>
<div class="wrap"><div class="card">
<ol>
<li><span class="num step-number" aria-hidden="true">1</span><div class="copy"><p class="item-title">פותחים טיול</p><p class="caption muted">בוחרים סוג, והרשימות מוכנות</p></div></li>
<li><span class="num step-number" aria-hidden="true">2</span><div class="copy"><p class="item-title">שולחים קישור בוואטסאפ</p><p class="caption muted">החברים מצטרפים מהדפדפן</p></div></li>
<li><span class="num step-number" aria-hidden="true">3</span><div class="copy"><p class="item-title">לוקחים פריטים</p><p class="caption muted">ורואים בזמן אמת מה עוד חסר</p></div></li>
</ol>
</div></div>
</body>
</html>
