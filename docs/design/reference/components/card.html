<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/tokens.css"><title>Card — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;800&amp;display=swap">
<style>
html,body{margin:0}
body{background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:var(--space-4);max-width:var(--content-max);margin:0 auto;padding:var(--space-5)}
.card{background:var(--card);border-radius:var(--radius-card);padding:var(--space-5)}
.card h2{margin:0;color:var(--ink)}
.card p{margin:0}
.muted{color:var(--ink-muted)}
.txt h2{margin-bottom:var(--space-3)}
.action{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.action .copy{display:flex;flex-direction:column;gap:var(--space-1)}
.btn-tonal{display:inline-flex;align-items:center;flex:none;height:var(--size-button-sm);padding-inline:var(--space-5);border:0;border-radius:var(--radius-pill);background:var(--primary-tint);color:var(--primary-strong);font-family:var(--font-sans);cursor:pointer}
</style></head>
<body>
<div class="stack">
<section class="card txt">
<h2 class="section-title">עוד אין טיולים</h2>
<p class="body muted">פותחים טיול, שולחים קישור לחברים, ובוחרים ביחד מי מביא מה.</p>
</section>
<section class="card action">
<div class="copy">
<p class="item-title">רוצים לראות איך זה נראה?</p>
<p class="caption muted">טיול לדוגמה עם חברים, פריטים והוצאות</p>
</div>
<button class="btn-tonal button-sm" type="button">טיול לדוגמה</button>
</section>
</div>
</body>
</html>
