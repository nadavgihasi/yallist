# Assign an item from its sheet's "who brings it" picker, then take it off again.
appId: app.yallist
url: ${WEB_URL}
# A video per flow, kept even when it fails (onFlowComplete always runs).
onFlowStart:
  - startRecording: ${MAESTRO_FILENAME}
onFlowComplete:
  - stopRecording
tags: [items]
---
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/new-trip.yaml
- runFlow:
    file: ../common/add-item.yaml
    env:
      ITEM: Tent
- tapOn: Tent
- assertVisible: מי מביא\?
# The sheet says whose it is as text; the picker is the only control for a single item.
- tapOn: אני
- assertVisible:
    id: item-status
    text: אצלך
- tapOn: אני
- assertVisible:
    id: item-status
    text: חסר
