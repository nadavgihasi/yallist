# Assign an item from its sheet's "who brings it" picker, then take it off again.
appId: app.yallist
url: ${WEB_URL}
# A video per flow, kept even when it fails (onFlowComplete always runs).
onFlowStart:
  - startRecording: ${MAESTRO_FILENAME}
onFlowComplete:
  - stopRecording
tags: [items]
---
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/new-trip.yaml
- runFlow:
    file: ../common/add-item.yaml
    env:
      ITEM: Tent
- tapOn: Tent
- assertVisible: מי מביא\?
- tapOn: אני
- assertVisible: לא אני, לשחרר
- tapOn: אני
- assertNotVisible: לא אני, לשחרר
