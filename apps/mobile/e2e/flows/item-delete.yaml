# Deleting an item lands back on the trip's list. Issue #70: the web page went white instead.
appId: app.yallist
url: ${WEB_URL}
tags: [items]
---
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/new-trip.yaml
- runFlow:
    file: ../common/add-item.yaml
    env:
      ITEM: Lantern
- runFlow:
    file: ../common/add-item.yaml
    env:
      ITEM: Rope
- tapOn: Lantern
- tapOn:
    id: item-delete
# The first tap asks to confirm.
- tapOn:
    id: item-delete
- assertVisible:
    id: trip-title
- assertVisible: Rope
- assertNotVisible: Lantern
