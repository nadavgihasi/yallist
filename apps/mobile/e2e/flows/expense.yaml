# Add an expense from the money tab, without a receipt, and see it listed.
appId: app.yallist
url: ${WEB_URL}
# A video per flow, kept even when it fails (onFlowComplete always runs).
onFlowStart:
  - startRecording: ${MAESTRO_FILENAME}
onFlowComplete:
  - stopRecording
tags: [money, shard-1]
---
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/new-trip.yaml
- tapOn:
    id: trip-tab-money
- tapOn:
    id: trip-add
- tapOn:
    id: expense-amount
- inputText: '120'
- tapOn:
    id: expense-what
- inputText: Gas
- tapOn:
    id: expense-save
- assertVisible: Gas
- assertVisible: .*120.*
# Without a receipt, its button offers to add one.
- tapOn:
    id: expense-receipt
- assertVisible:
    id: receipt-choose
