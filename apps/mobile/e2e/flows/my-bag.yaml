# My bag (התיק שלי): what I took from the list is in it, I add something only I need, pack it,
# and it stays packed after a reload. Private items count nowhere on the shared list. Deleting asks
# once more.
appId: app.yallist
url: ${WEB_URL}
# A video per flow, kept even when it fails (onFlowComplete always runs).
onFlowStart:
  - startRecording: ${MAESTRO_FILENAME}
onFlowComplete:
  - stopRecording
tags: [items]
---
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/new-trip.yaml
- runFlow:
    file: ../common/add-item.yaml
    env:
      ITEM: Grill
- tapOn:
    id: item-claim
- tapOn:
    id: trip-tab-bag
- assertVisible: Grill
- assertVisible: אצלך · מהרשימה
- tapOn:
    id: trip-add
- tapOn:
    id: bag-add-name
- inputText: Sunscreen
- tapOn:
    id: bag-add-save
- assertVisible: Sunscreen
- assertVisible:
    id: bag-progress
    text: ארזת 0 מתוך 2
# Unpacked first, in list order: Grill, then my private Sunscreen.
- tapOn:
    id: bag-pack
    index: 1
- assertVisible:
    id: bag-progress
    text: ארזת 1 מתוך 2
# Packed shows before the API has it; leaving the page sooner would drop the save. Nothing has
# this id: this only waits (longer on a preview's cold Lambda).
- extendedWaitUntil:
    visible:
      id: never-shown
    timeout: 4000
    optional: true
- openLink: ${WEB_URL}
- tapOn: E2E trip
# The shared list doesn't count it.
- assertVisible:
    id: bring-progress
    text: 1 מתוך 1 מסודרים
- assertNotVisible: Sunscreen
- tapOn:
    id: trip-tab-bag
- assertVisible:
    id: bag-progress
    text: ארזת 1 מתוך 2
- assertVisible:
    id: bag-unpack
# The first tap asks to confirm.
- tapOn:
    id: bag-delete
- tapOn:
    id: bag-delete
- assertNotVisible: Sunscreen
- assertVisible:
    id: bag-progress
    text: ארזת 0 מתוך 1
