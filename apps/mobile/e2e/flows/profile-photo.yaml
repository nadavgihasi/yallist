# Add a profile photo, see it on the home screen's avatar, then remove it.
# The web build picks e2e/fixtures/receipt.jpg in place of the file picker (scripts/e2e-web.sh).
appId: app.yallist
url: ${WEB_URL}
# A video per flow, kept even when it fails (onFlowComplete always runs).
onFlowStart:
  - startRecording: ${MAESTRO_FILENAME}
onFlowComplete:
  - stopRecording
# Untagged for shard-1, so it runs in shard 2 (scripts/e2e-web.sh), the shorter one.
tags: [profile]
---
- runFlow: ../common/sign-in.yaml
- tapOn:
    id: home-profile
- assertNotVisible:
    id: profile-photo-remove
- tapOn:
    id: profile-photo-change
# Cropped and shrunk on the device, uploaded, then attached; only a photo can be removed.
- extendedWaitUntil:
    visible:
      id: profile-photo-remove
    timeout: 15000
- tapOn:
    id: profile-photo-remove
- extendedWaitUntil:
    notVisible:
      id: profile-photo-remove
    timeout: 15000
