# Claim an item from the list, then release it.
appId: app.yallist
url: ${WEB_URL}
# A video per flow, kept even when it fails (onFlowComplete always runs).
onFlowStart:
  - startRecording: ${MAESTRO_FILENAME}
onFlowComplete:
  - stopRecording
tags: [items]
---
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/new-trip.yaml
- runFlow:
    file: ../common/add-item.yaml
    env:
      ITEM: Grill
- tapOn:
    id: item-claim
- assertVisible:
    id: item-release
- tapOn:
    id: item-release
- assertVisible:
    id: item-claim
