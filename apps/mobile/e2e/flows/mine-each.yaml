# My own list ("הרשימה שלי") has every "each" item (everyone brings their own), before I mark
# that I have it; the shared list doesn't.
appId: app.yallist
url: ${WEB_URL}
# A video per flow, kept even when it fails (onFlowComplete always runs).
onFlowStart:
  - startRecording: ${MAESTRO_FILENAME}
onFlowComplete:
  - stopRecording
tags: [items]
---
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/new-trip.yaml
- tapOn:
    id: trip-add
- tapOn:
    id: item-form-name
- inputText: Sleeping bag
- tapOn: לכל אחד.*
- tapOn:
    id: item-form-save
# Added from the shared list, it shows on my list, where it lives.
- assertVisible: Sleeping bag
- tapOn:
    id: trip-part-shared
- assertNotVisible: Sleeping bag
- tapOn:
    id: trip-part-mine
- assertVisible: Sleeping bag
- assertNotVisible:
    id: empty-state-action
