<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F5F8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #f4f5f8;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Pointer and keyboard affordances for pressables (react-native-web renders them with ARIA roles). */
      [role='button'],
      [role='link'],
      [role='tab'],
      [role='radio'],
      [role='checkbox'],
      [role='switch'] {
        cursor: pointer;
        transition: filter 0.15s;
      }
      [aria-disabled='true'] {
        cursor: default;
      }
      @media (hover: hover) {
        :is([role='button'], [role='link'], [role='tab'], [role='radio'], [role='checkbox']):not(
            [aria-disabled='true']
          ):hover {
          filter: brightness(0.96);
        }
      }
      :focus-visible {
        outline: 3px solid rgba(66, 90, 244, 0.55) !important;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <noscript>צריך להפעיל JavaScript כדי להשתמש באפליקציה.</noscript>
    <div id="root"></div>
  </body>
</html>
