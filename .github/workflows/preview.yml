name: Preview

# A live environment per PR on real AWS: its own `pr-<n>` SST stage in us-west-2, served under
# /pr-<n> by the shared `preview` stage (preview-stage.yml). Deployed on every push, removed when
# the PR closes, or 6 hours after its last push by preview-cleanup.yml. See
# docs/plans/e2e-live-environments.md.
#
# Only PRs from this repo's branches, never forks (which get no secrets or OIDC token anyway),
# and never pull_request_target. Only collaborators can push branches, so there's no allowlist.
# Jobs run in the `preview` environment, the only one the preview role (AWS_PREVIEW_ROLE_ARN)
# trusts, and are skipped until that variable is set (docs/deploy.md#set-up).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# One run per PR at a time: a push or a close cancels the run in progress, and the next deploy or
# remove unlocks the stage that run left locked. A reopen waits instead: the only run it can find
# is the close's remove, and cancelling that mid-way leaves the stage's state pointing at resources
# it already deleted.
#
# deploy and remove also hold preview-stage-<n>, which never cancels: preview-cleanup.yml removes
# stale stages in it, outside this run-level group, so a push can't cancel that removal halfway;
# its deploy waits for the removal to finish and redeploys fresh.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'reopened' }}

env:
  STAGE: pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PREVIEW_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency:
      group: preview-stage-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for the preview role
      pull-requests: write # the sticky comment
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      api: ${{ steps.deploy.outputs.api }}
      realtime: ${{ steps.deploy.outputs.realtime }}
    env:
      SST_SECRET_BetterAuthSecret: ${{ secrets.BETTER_AUTH_SECRET }}
      EXPO_PUBLIC_STAGE: pr-${{ github.event.pull_request.number }} # VersionLine
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: us-west-2
      - name: Deploy the PR's stage
        id: deploy
        # Only this PR's runs touch its stage, one at a time, so a lock is a cancelled run's.
        run: |
          pnpm sst unlock --stage "$STAGE"
          pnpm sst deploy --stage "$STAGE"
          jq -r '"url=\(.url)/", "api=\(.api)", "realtime=\(.realtime)"' \
            infra/app/.sst/outputs.json >> "$GITHUB_OUTPUT"
      # The cluster starts empty; later pushes apply only new migrations.
      - name: Migrate the database
        run: pnpm sst shell --stage "$STAGE" -- pnpm --filter @yallist/api db:migrate
      - name: Smoke check
        env:
          URL: ${{ steps.deploy.outputs.url }}
          API: ${{ steps.deploy.outputs.api }}
        run: |
          curl -fsS --retry 5 --retry-all-errors "$API/health"
          curl -fsS --retry 5 --retry-all-errors -o /dev/null "$URL"
      - name: Post the URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.url }}
          API: ${{ steps.deploy.outputs.api }}
        run: |
          marker='<!-- preview -->'
          body="$marker
          **Preview:** $URL
          API: $API · commit $SHA · guests only

          Removed when this PR closes, or 6 hours after its last push (the next push brings it back)."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [[ -n $id ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

  # The UI tests (apps/mobile/e2e) against the preview, on two workers as in ui-tests.yml. No AWS
  # role or secrets: they only browse the preview. Every flow signs in as a new guest, so the
  # shards share the preview's database without seeing each other's data.
  ui-shard:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/maestro-web
        id: maestro
      # Not the flows tagged test-route: they need a build that opens the test-only routes
      # (EXPO_PUBLIC_E2E), which a preview people use mustn't be.
      - run: scripts/e2e-web.sh --exclude-tags=test-route apps/mobile/e2e
        env:
          MAESTRO: ${{ steps.maestro.outputs.maestro }}
          E2E_WEB_URL: ${{ needs.deploy.outputs.url }}
          E2E_SHARD: ${{ matrix.shard }}
          E2E_OUT: ${{ runner.temp }}/ui-tests
      # One name across attempts, so "Re-run failed jobs" replaces a shard's results.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-ui-tests-${{ github.run_number }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-tests
          retention-days: 14
          overwrite: true

  # Fails unless the preview deployed, every shard passed and the preview-only tests passed.
  ui-tests:
    needs: [deploy, ui-shard, preview-only]
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: preview-ui-tests-${{ github.run_number }}-shard-*
          path: results
      - name: Summary
        env:
          ARTIFACTS: '[Videos and logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts) (`preview-ui-tests-…-shard-N`): one MP4 per flow under `maestro/*/<flow>/startRecording/`.'
        run: python3 scripts/ui-tests-summary.py results/*/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Fail unless every shard and the preview-only tests passed
        env:
          DEPLOY: ${{ needs.deploy.result }}
          SHARDS: ${{ needs.ui-shard.result }}
          PREVIEW_ONLY: ${{ needs.preview-only.result }}
        run: test "$DEPLOY" = success && test "$SHARDS" = success && test "$PREVIEW_ONLY" = success

  # The preview-only UI tests (apps/mobile/e2e/preview, Playwright): photos through the real file
  # input to S3, two sessions (invite link, approval, AppSync Events) and CORS on the real API.
  # No AWS role or secrets: they only browse the preview. See docs/plans/ui-tests.md.
  preview-only:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser (Chrome headless shell) and ffmpeg for the videos, per Playwright version.
      - id: playwright
        run: echo "version=$(pnpm --filter mobile exec playwright --version | cut -d" " -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter mobile exec playwright install chromium-headless-shell ffmpeg
      - run: pnpm --filter mobile exec playwright test
        env:
          E2E_WEB_URL: ${{ needs.deploy.outputs.url }}
          E2E_API_URL: ${{ needs.deploy.outputs.api }}
          E2E_REALTIME_HOST: ${{ needs.deploy.outputs.realtime }}
          E2E_OUT: ${{ runner.temp }}/preview-only
      # A video per page (two per test for two people), JUnit, and a trace for each failure.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-only-tests-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-only
          retention-days: 14

  remove:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PREVIEW_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency:
      group: preview-stage-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    environment: preview
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps: # main's config and script, whatever the PR changed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: us-west-2
      - run: scripts/preview-remove.sh "$STAGE"
