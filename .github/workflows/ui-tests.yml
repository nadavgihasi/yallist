name: UI tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Maestro flows (apps/mobile/e2e) on the web export, against the local API on a fresh database.
  # See docs/plans/ui-tests.md.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      MAESTRO_VERSION: 2.11.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Uses the runner's Java 17. Chrome for Testing 147 comes via Selenium (see e2e-web.sh).
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      # Ubuntu 24.04's AppArmor blocks the sandbox of a Chrome outside /opt (Chrome for Testing).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: scripts/e2e-web.sh
        env:
          E2E_OUT: ${{ runner.temp }}/ui-tests
      # Videos, JUnit, screenshots on failure, Maestro, API and web logs.
      - uses: actions/upload-artifact@v7
        id: upload
        if: always()
        with:
          name: ui-tests-web-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-tests
          retention-days: 14
      - name: Summary
        if: always()
        env:
          JUNIT: ${{ runner.temp }}/ui-tests/junit.xml
          ARTIFACTS: '[Videos and logs](${{ steps.upload.outputs.artifact-url }}): one MP4 per flow under `maestro/*/<flow>/startRecording/`.'
        run: python3 scripts/ui-tests-summary.py "$JUNIT" >> "$GITHUB_STEP_SUMMARY"
