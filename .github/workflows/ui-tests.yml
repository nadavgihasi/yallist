name: UI tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Maestro flows (apps/mobile/e2e) on the web export, against the local API on a fresh database.
# One job exports the app, two shards run half the flows each, and `web` reports the result.
# See docs/plans/ui-tests.md.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API URL every shard serves (scripts/e2e-web.sh API_PORT), and the photo the build
      # picks in place of the file picker (EXPO_PUBLIC_E2E_RECEIPT there).
      - run: |
          EXPO_PUBLIC_E2E_RECEIPT="data:image/jpeg;base64,$(base64 -w0 apps/mobile/e2e/fixtures/receipt.jpg)" \
            pnpm --filter mobile exec expo export -p web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3100
      # One name across attempts, so a shard rerun after "Re-run failed jobs" finds this build.
      - uses: actions/upload-artifact@v7
        with:
          name: ui-tests-web-build
          path: apps/mobile/dist
          retention-days: 1
          overwrite: true

  shard:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ui-tests-web-build
          path: apps/mobile/dist
      - uses: ./.github/actions/maestro-web
        id: maestro
      - run: scripts/e2e-web.sh
        env:
          MAESTRO: ${{ steps.maestro.outputs.maestro }}
          E2E_SHARD: ${{ matrix.shard }}
          E2E_PREBUILT: 1
          E2E_OUT: ${{ runner.temp }}/ui-tests
      # Videos, JUnit, screenshots on failure, Maestro, API and web logs. A rerun replaces them.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-tests-web-${{ github.run_number }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-tests
          retention-days: 14
          overwrite: true

  # The one check to require: fails unless every shard passed.
  web:
    needs: [build, shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: ui-tests-web-${{ github.run_number }}-shard-*
          path: results
      - name: Summary
        env:
          ARTIFACTS: '[Videos and logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts) (`ui-tests-web-…-shard-N`): one MP4 per flow under `maestro/*/<flow>/startRecording/`.'
        run: python3 scripts/ui-tests-summary.py results/*/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Fail unless every shard passed
        env:
          BUILD: ${{ needs.build.result }}
          SHARDS: ${{ needs.shard.result }}
        run: test "$BUILD" = success && test "$SHARDS" = success
