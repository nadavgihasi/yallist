name: Android build

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Backend the app talks to
        type: choice
        options: [dev, production]
        default: dev
  pull_request:
    paths:
      - .github/workflows/android.yml
      - apps/mobile/plugins/**
      - apps/mobile/app.json
      - apps/mobile/app.config.ts

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Manual runs take the stage's backend URLs from its environment variables. PR runs are only a
    # compile check, with no environment (environments accept main only) and so no backend.
    environment: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version
      # versionName is the latest release (see docs/releases.md); versionCode is the run number.
      - name: Version from the latest release tag
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' || echo v0.0.0)
          echo "APP_VERSION=${tag#v}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Caches ~/.gradle (dependencies, Gradle build cache). Written by main runs only; PRs read it.
      - uses: gradle/actions/setup-gradle@v5
      # The C++ of React Native and the native modules is most of the build; ccache keeps it across
      # runs (CMake picks up CMAKE_*_COMPILER_LAUNCHER from the env). Keyed by ABI set, and pruned
      # to what this run compiled.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: android-${{ inputs.stage == 'production' && 'all-abis' || 'arm64' }}
          max-size: 2G
          evict-old-files: job
      - run: pnpm install --frozen-lockfile

      - name: Generate native project
        working-directory: apps/mobile
        run: CI=1 npx expo prebuild -p android --no-install

      - name: Decode upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key secret; release builds are debug-signed and can't go to Play."
          fi

      - name: Build release
        working-directory: apps/mobile/android
        env:
          STAGE: ${{ inputs.stage }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # Precompiled headers are otherwise uncacheable, and the NDK's mtime changes on every
          # runner, so identify the compiler by content.
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
          CCACHE_COMPILERCHECK: content
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          # Inlined into the JS bundle by Metro during the release build.
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_REALTIME_URL: ${{ vars.EXPO_PUBLIC_REALTIME_URL }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
        # Production builds are for Play: an AAB plus APK for every ABI. Dev and PR builds are for
        # phones: an arm64 APK only, without lint, which is a quarter of the native compilation.
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          if [ "$STAGE" = production ]; then
            args="bundleRelease assembleRelease"
          else
            args="assembleRelease -PreactNativeArchitectures=arm64-v8a -x lintVitalRelease"
          fi
          # shellcheck disable=SC2086 # $args is a list of Gradle arguments
          ./gradlew $args --build-cache --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: yallist-android-${{ inputs.stage || 'pr' }}-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
