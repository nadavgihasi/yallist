name: Android build

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Backend the app talks to
        type: choice
        options: [dev, production]
        default: dev
      publish:
        description: Upload the AAB to Google Play (production only)
        type: boolean
        default: false
      ref:
        description: Tag or commit to build (default the branch's head)
        type: string
        default: ''
  # PRs call it from pr.yml when .github/workflows/android.yml, apps/mobile/plugins/**,
  # apps/mobile/app.json or apps/mobile/app.config.ts change.
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      # Not passed by pr.yml: only manual runs upload source maps.
      SENTRY_AUTH_TOKEN:
        required: false
      # Production environment secret; only publishing runs use it (docs/android.md).
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read

# One upload to Play at a time; a second publish for the same version would be rejected anyway.
concurrency:
  group: android-${{ inputs.publish && 'publish' || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Manual runs take the stage's backend URLs from its environment variables. PR runs are only a
    # compile check, with no environment (environments accept main only) and so no backend.
    environment: ${{ inputs.stage }}
    steps:
      # deploy.yml's release job dispatches publishing runs on main with ref set to the new tag:
      # the job runs as main (environments accept main only) but builds exactly the release.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # tags, for the version
      # versionName is the latest release (see docs/releases.md); versionCode is the run number.
      - name: Version from the latest release tag
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' || echo v0.0.0)
          echo "APP_VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # Only signed production bundles go to Play; fail before the 30-minute build, not after.
      - name: Check publishing setup
        if: inputs.publish
        env:
          STAGE: ${{ inputs.stage }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          [ "$STAGE" = production ] || { echo "::error::Only production builds are published to Play."; exit 1; }
          [ "$HAS_KEYSTORE" = true ] || { echo "::error::No upload key secrets; Play rejects debug-signed bundles (docs/android.md)."; exit 1; }
          [ "$HAS_PLAY_KEY" = true ] || { echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is not set on the production environment (docs/android.md)."; exit 1; }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Caches ~/.gradle (dependencies, Gradle build cache). Written by main runs only; PRs read it.
      - uses: gradle/actions/setup-gradle@v5
      # The C++ of React Native and the native modules is most of the build; ccache keeps it across
      # runs (CMake picks up CMAKE_*_COMPILER_LAUNCHER from the env). Keyed by ABI set, and pruned
      # to what this run compiled.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: android-${{ inputs.stage == 'production' && 'all-abis' || 'arm64' }}
          max-size: 2G
          evict-old-files: job
      # A manual build without its stage's URLs would ship an app that can't reach the backend or
      # shares broken invite links (docs/android.md).
      - name: Check the stage's variables
        if: inputs.stage
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_REALTIME_URL: ${{ vars.EXPO_PUBLIC_REALTIME_URL }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
        run: |
          missing=0
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_REALTIME_URL EXPO_PUBLIC_GOOGLE_CLIENT_ID EXPO_PUBLIC_WEB_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable $name is not set on the ${{ inputs.stage }} environment (docs/android.md)."
              missing=1
            fi
          done
          exit "$missing"
      - run: pnpm install --frozen-lockfile

      - name: Generate native project
        working-directory: apps/mobile
        run: CI=1 npx expo prebuild -p android --no-install

      - name: Decode upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key secret; release builds are debug-signed and can't go to Play."
          fi

      - name: Build release
        working-directory: apps/mobile/android
        env:
          STAGE: ${{ inputs.stage }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # Precompiled headers are otherwise uncacheable, and the NDK's mtime changes on every
          # runner, so identify the compiler by content.
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
          CCACHE_COMPILERCHECK: content
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          # Inlined into the JS bundle by Metro during the release build.
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_REALTIME_URL: ${{ vars.EXPO_PUBLIC_REALTIME_URL }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }} # invite links
          EXPO_PUBLIC_GIT_SHA: ${{ env.GIT_SHA }}
          EXPO_PUBLIC_STAGE: ${{ inputs.stage }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          # Source maps to Sentry, as the release and dist the app reports (src/lib/sentryOptions.ts).
          # Only manual runs have the token (an environment secret); PR builds skip the upload.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: yallist-app
          SENTRY_URL: https://sentry.io/
          SENTRY_RELEASE: yallist@${{ env.APP_VERSION }}
          SENTRY_DIST: ${{ env.GIT_SHA }}
        # Production builds are for Play: an AAB plus APK for every ABI. Dev and PR builds are for
        # phones: an arm64 APK only, without lint, which is a quarter of the native compilation.
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          if [ "$STAGE" = production ]; then
            args="bundleRelease assembleRelease"
          else
            args="assembleRelease -PreactNativeArchitectures=arm64-v8a -x lintVitalRelease"
          fi
          # shellcheck disable=SC2086 # $args is a list of Gradle arguments
          ./gradlew $args --build-cache --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: yallist-android-${{ inputs.stage || 'pr' }}-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish to Google Play
        if: inputs.publish
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
        run: scripts/play-upload.sh apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "$APP_VERSION"
