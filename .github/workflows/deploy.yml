name: Deploy

# main is the only way changes reach AWS: CI, then global (account-wide), dev and production.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # GitHub OIDC token, exchanged for the deploy role. Every job but `version` deploys.
  id-token: write # zizmor: ignore[excessive-permissions]
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The same checks as pull requests (ci.yml). Nothing is released or deployed unless they pass.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The next version from commit titles (docs/releases.md), for the builds. `release` tags it.
  version:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: scripts/release.sh

  global:
    needs: ci
    runs-on: ubuntu-latest
    environment: global
    # Deploys take minutes; CloudFront updates can take ~15. Don't let a hung one hold the queue for 6 hours.
    timeout-minutes: 30
    steps: &deploy
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      # deploy:global, deploy:dev or deploy:prod
      - name: Deploy ${{ github.job }}
        run: pnpm deploy:${{ github.job == 'production' && 'prod' || github.job }}
        env:
          BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
      # Show the stage's outputs (web and API URLs) on the run's summary page.
      - name: Summarize ${{ github.job }} outputs
        run: |
          echo "### ${{ github.job }}" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'to_entries[] | "- \(.key): \(.value)"' infra/${{ github.job == 'global' && 'global' || 'app' }}/.sst/outputs.json >> "$GITHUB_STEP_SUMMARY"
      # Apply database migrations with the stage's linked resources. The global stack has no database.
      - name: Migrate ${{ github.job }} database
        if: github.job != 'global'
        run: pnpm sst shell --stage ${{ github.job }} -- pnpm --filter @yallist/api db:migrate
      # Open the GitHub issues that saved feedback is missing (docs/deploy.md, Feedback).
      - name: Retry ${{ github.job }} feedback issues
        if: github.job != 'global'
        run: pnpm sst shell --stage ${{ github.job }} -- pnpm --filter @yallist/api feedback:retry
      # Smoke check: the API Lambda boots and the web app is served, so a broken dev stops production.
      - name: Smoke check ${{ github.job }}
        if: github.job != 'global'
        run: |
          curl -fsS --retry 5 --retry-all-errors "$(jq -r .api infra/app/.sst/outputs.json)/health"
          curl -fsS --retry 5 --retry-all-errors -o /dev/null "$(jq -r .url infra/app/.sst/outputs.json)"

  dev:
    needs: [global, version]
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    # SST reads a secret's value from SST_SECRET_<name>; the values are this environment's secrets.
    env:
      APP_VERSION: ${{ needs.version.outputs.version }} # app.config.ts
      EXPO_PUBLIC_GIT_SHA: ${{ github.sha }} # VersionLine
      EXPO_PUBLIC_STAGE: dev
      SST_SECRET_BetterAuthSecret: ${{ secrets.BETTER_AUTH_SECRET }}
      SST_SECRET_GoogleClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SST_SECRET_GithubFeedbackToken: ${{ secrets.FEEDBACK_GITHUB_TOKEN }} # optional
      SST_SECRET_TelegramBotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }} # optional, alerts
      SST_SECRET_TelegramChatId: ${{ secrets.TELEGRAM_CHAT_ID }} # optional, alerts
      SST_SECRET_SentryDsn: ${{ secrets.SENTRY_DSN }} # optional, API errors
      SST_SECRET_SentryWebhookSecret: ${{ secrets.SENTRY_WEBHOOK_SECRET }} # optional
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }} # optional, app errors
      # Source map uploads (web export and API bundle); skipped without the token.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
    steps: *deploy

  production:
    needs: [dev, version]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    # SST reads a secret's value from SST_SECRET_<name>; the values are this environment's secrets.
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
      EXPO_PUBLIC_STAGE: production
      SST_SECRET_BetterAuthSecret: ${{ secrets.BETTER_AUTH_SECRET }}
      SST_SECRET_GoogleClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SST_SECRET_GithubFeedbackToken: ${{ secrets.FEEDBACK_GITHUB_TOKEN }} # optional
      SST_SECRET_TelegramBotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }} # optional, alerts
      SST_SECRET_TelegramChatId: ${{ secrets.TELEGRAM_CHAT_ID }} # optional, alerts
      SST_SECRET_SentryDsn: ${{ secrets.SENTRY_DSN }} # optional, API errors
      SST_SECRET_SentryWebhookSecret: ${{ secrets.SENTRY_WEBHOOK_SECRET }} # optional
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }} # optional, app errors
      # Source map uploads (web export and API bundle); skipped without the token.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
    steps: *deploy

  # Tags main and creates the GitHub release only once production has it (docs/releases.md).
  release:
    needs: [production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/release.sh --publish
        env:
          GH_TOKEN: ${{ github.token }}
