name: Deploy

# main is the only way changes reach AWS: global (account-wide), then dev, then production.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC token, exchanged for the deploy role
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  global:
    runs-on: ubuntu-latest
    environment: global
    steps: &deploy
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      # deploy:global, deploy:dev or deploy:prod
      - run: pnpm deploy:${{ github.job == 'production' && 'prod' || github.job }}
        env:
          BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
      # Show the stage's outputs (web and API URLs) on the run's summary page.
      - run: |
          echo "### ${{ github.job }}" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'to_entries[] | "- \(.key): \(.value)"' infra/${{ github.job == 'global' && 'global' || 'app' }}/.sst/outputs.json >> "$GITHUB_STEP_SUMMARY"
      # Apply database migrations with the stage's linked resources. The global stack has no database.
      - if: github.job != 'global'
        run: pnpm sst shell --stage ${{ github.job }} -- pnpm --filter @yallist/api db:migrate

  dev:
    needs: global
    runs-on: ubuntu-latest
    environment: dev
    # SST reads a secret's value from SST_SECRET_<name>; the values are this environment's secrets.
    env:
      SST_SECRET_BetterAuthSecret: ${{ secrets.BETTER_AUTH_SECRET }}
      SST_SECRET_GoogleClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps: *deploy

  production:
    needs: dev
    runs-on: ubuntu-latest
    environment: production
    # SST reads a secret's value from SST_SECRET_<name>; the values are this environment's secrets.
    env:
      SST_SECRET_BetterAuthSecret: ${{ secrets.BETTER_AUTH_SECRET }}
      SST_SECRET_GoogleClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps: *deploy
